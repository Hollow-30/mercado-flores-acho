name: CI mercado Acho

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, pruebas y seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalación reproducible
        run: npm ci
      - name: Build
        run: npm run build
      - name: Pruebas automatizadas
        run: npm test
      - name: Dependencias y secretos
        run: npm run security
